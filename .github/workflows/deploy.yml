name: Test & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite
        env:
          ENVIRONMENT: test
          STORAGE_BACKEND: json
          AWS_REGION: us-east-1
        run: |
          pytest backend/tests -v

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Package Elastic Beanstalk Bundle
        run: |
          zip -r clearsky-deploy.zip application.py Procfile requirements.txt backend data .ebextensions \
            -x "*__pycache__*" -x "*.pyc" -x "*.pytest_cache*" -x "data/test_s3_lake/*" -x "data/s3_lake/*"

      - name: Upload Deployment Bundle
        uses: actions/upload-artifact@v4
        with:
          name: clearsky-deployment-bundle
          path: clearsky-deploy.zip
          retention-days: 7

  deploy:
    name: Deploy to Elastic Beanstalk
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Deployment Prerequisites
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          EB_APP_NAME: ${{ secrets.EB_APP_NAME }}
          EB_ENV_NAME: ${{ secrets.EB_ENV_NAME }}
          S3_DEPLOY_BUCKET: ${{ secrets.S3_DEPLOY_BUCKET }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error title=Missing AWS Credentials::AWS_DEPLOY_ROLE_ARN secret is not configured."
            exit 1
          fi
          if [ -z "$EB_APP_NAME" ] || [ -z "$EB_ENV_NAME" ] || [ -z "$S3_DEPLOY_BUCKET" ]; then
            echo "::error title=Missing EB Configuration::Required Elastic Beanstalk secrets (EB_APP_NAME, EB_ENV_NAME, S3_DEPLOY_BUCKET) are missing."
            exit 1
          fi

      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - name: Download Deployment Bundle
        uses: actions/download-artifact@v4
        with:
          name: clearsky-deployment-bundle

      - name: Deploy to Elastic Beanstalk Environment
        env:
          EB_APP_NAME: ${{ secrets.EB_APP_NAME }}
          EB_ENV_NAME: ${{ secrets.EB_ENV_NAME }}
          S3_DEPLOY_BUCKET: ${{ secrets.S3_DEPLOY_BUCKET }}
          REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          VERSION_LABEL="deploy-$(date +%Y%m%d%H%M%S)-${{ github.sha }}"
          echo "Uploading bundle to s3://${S3_DEPLOY_BUCKET}/clearsky/${VERSION_LABEL}.zip"
          aws s3 cp clearsky-deploy.zip "s3://${S3_DEPLOY_BUCKET}/clearsky/${VERSION_LABEL}.zip" --region ${REGION}

          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APP_NAME" \
            --version-label "$VERSION_LABEL" \
            --source-bundle S3Bucket="$S3_DEPLOY_BUCKET",S3Key="clearsky/${VERSION_LABEL}.zip" \
            --region ${REGION}

          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENV_NAME" \
            --version-label "$VERSION_LABEL" \
            --region ${REGION}

          echo "Waiting for Elastic Beanstalk environment update..."
          aws elasticbeanstalk wait environment-updated --environment-name "$EB_ENV_NAME" --region ${REGION}

          CNAME=$(aws elasticbeanstalk describe-environments \
            --environment-names "$EB_ENV_NAME" \
            --region ${REGION} \
            --query "Environments[0].CNAME" \
            --output text)

          echo "Deployment successful: http://${CNAME}"
