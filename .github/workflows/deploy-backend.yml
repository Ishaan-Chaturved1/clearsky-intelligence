name: Deploy Backend — Elastic Beanstalk

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - development
      skip_tests:
        description: 'Skip pre-deployment tests (emergency use only)'
        required: false
        default: 'false'
        type: boolean

  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'application.py'
      - 'Procfile'
      - 'requirements.txt'
      - '.ebextensions/**'

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGION: us-east-1
  TARGET_ENV: ${{ github.event.inputs.target_environment || 'production' }}

jobs:
  backend-test:
    name: Run Pre-Deployment Backend Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyyaml

      - name: Run Backend Pytest Suite
        env:
          ENVIRONMENT: test
          STORAGE_BACKEND: json
          AWS_REGION: us-east-1
        run: pytest backend/tests -v --durations=5

  package:
    name: Package Elastic Beanstalk Bundle
    runs-on: ubuntu-latest
    needs: [backend-test]
    if: always() && (needs.backend-test.result == 'success' || needs.backend-test.result == 'skipped')
    outputs:
      version_label: ${{ steps.label.outputs.version_label }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Version Label
        id: label
        run: |
          TS=$(date +%Y%m%d%H%M%S)
          LABEL="backend-${TARGET_ENV}-${TS}-${{ github.sha }}"
          echo "version_label=${LABEL}" >> "$GITHUB_OUTPUT"
          echo "Version label: ${LABEL}"

      - name: Package Backend Application
        run: |
          zip -r clearsky-backend.zip \
            application.py \
            Procfile \
            requirements.txt \
            backend \
            data \
            .ebextensions \
            -x "*__pycache__*" -x "*.pyc" -x "*.pytest_cache*" \
               -x "data/test_s3_lake/*" -x "data/s3_lake/*"
          echo "Lean backend bundle created: $(du -sh clearsky-backend.zip | cut -f1)"

      - name: Upload Deployment Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-bundle-${{ github.sha }}
          path: clearsky-backend.zip
          retention-days: 7

  deploy-eb:
    name: Deploy to AWS Elastic Beanstalk
    runs-on: ubuntu-latest
    needs: [package]
    environment: production
    permissions:
      contents: read
    outputs:
      eb_app_url: ${{ steps.deploy.outputs.eb_app_url }}

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: Verify AWS Identity & Account ID
        env:
          EXPECTED_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          CALLER_ACCOUNT=$(aws sts get-caller-identity --query "Account" --output text)
          echo "Authenticated to AWS Account: ${CALLER_ACCOUNT}"
          if [ -n "$EXPECTED_ACCOUNT_ID" ] && [ "$CALLER_ACCOUNT" != "$EXPECTED_ACCOUNT_ID" ]; then
            echo "::error::Account mismatch! Current account ${CALLER_ACCOUNT} does not match expected ${EXPECTED_ACCOUNT_ID}."
            exit 1
          fi

      - name: Download Deployment Bundle
        uses: actions/download-artifact@v4
        with:
          name: backend-bundle-${{ github.sha }}

      - name: Upload Bundle to S3 & Update Elastic Beanstalk
        id: deploy
        env:
          APP_NAME: ${{ secrets.EB_APP_NAME || 'clearsky-intelligence' }}
          ENV_NAME: ${{ secrets.EB_ENV_NAME || format('clearsky-intelligence-{0}', env.TARGET_ENV) }}
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          CUSTOM_BUCKET: ${{ secrets.S3_DEPLOY_BUCKET }}
          VERSION_LABEL: ${{ needs.package.outputs.version_label }}
        run: |
          DEPLOY_BUCKET="${CUSTOM_BUCKET:-clearsky-deploy-${TARGET_ENV}-${ACCOUNT_ID}}"
          echo "Using deployment bucket: ${DEPLOY_BUCKET}"
          echo "Using EB application: ${APP_NAME}, environment: ${ENV_NAME}"

          # Ensure deployment bucket exists
          if ! aws s3api head-bucket --bucket "${DEPLOY_BUCKET}" 2>/dev/null; then
            echo "Bucket ${DEPLOY_BUCKET} does not exist. Creating..."
            aws s3 mb "s3://${DEPLOY_BUCKET}" --region "${REGION}"
            aws s3api put-bucket-versioning --bucket "${DEPLOY_BUCKET}" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "${DEPLOY_BUCKET}" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket "${DEPLOY_BUCKET}" \
              --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          fi

          S3_KEY="clearsky/${VERSION_LABEL}.zip"
          echo "Uploading bundle to s3://${DEPLOY_BUCKET}/${S3_KEY}"
          aws s3 cp clearsky-backend.zip "s3://${DEPLOY_BUCKET}/${S3_KEY}" --region "${REGION}"

          echo "Creating Elastic Beanstalk application version ${VERSION_LABEL}"
          aws elasticbeanstalk create-application-version \
            --application-name "${APP_NAME}" \
            --version-label "${VERSION_LABEL}" \
            --source-bundle S3Bucket="${DEPLOY_BUCKET}",S3Key="${S3_KEY}" \
            --region "${REGION}"

          echo "Updating Elastic Beanstalk environment ${ENV_NAME}"
          aws elasticbeanstalk update-environment \
            --environment-name "${ENV_NAME}" \
            --version-label "${VERSION_LABEL}" \
            --region "${REGION}"

          echo "Waiting for environment update to stabilize..."
          aws elasticbeanstalk wait environment-updated \
            --environment-name "${ENV_NAME}" \
            --region "${REGION}"

          CNAME=$(aws elasticbeanstalk describe-environments \
            --environment-names "${ENV_NAME}" \
            --region "${REGION}" \
            --query "Environments[0].CNAME" \
            --output text)

          HEALTH=$(aws elasticbeanstalk describe-environments \
            --environment-names "${ENV_NAME}" \
            --region "${REGION}" \
            --query "Environments[0].Health" \
            --output text)

          echo "Deployment finished. Environment Health: ${HEALTH}, CNAME: ${CNAME}"

          if [ -z "$CNAME" ] || [ "$CNAME" = "None" ]; then
            echo "::error::No CNAME returned by Elastic Beanstalk environment."
            exit 1
          fi

          if [ "$HEALTH" = "Red" ]; then
            echo "::error::Elastic Beanstalk environment health is RED following deployment update."
            exit 1
          fi

          echo "eb_app_url=http://${CNAME}" >> "$GITHUB_OUTPUT"

  smoke-test:
    name: Post-Deployment Smoke Verification
    runs-on: ubuntu-latest
    needs: [deploy-eb]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Smoke Verification Suite
        env:
          TARGET_URL: ${{ secrets.DEPLOYMENT_URL || needs.deploy-eb.outputs.eb_app_url }}
        run: |
          if [ -z "$TARGET_URL" ] || [ "$TARGET_URL" = "None" ]; then
            echo "::error::No target deployment URL resolved for smoke tests."
            exit 1
          fi
          echo "Executing post-deployment smoke tests against: ${TARGET_URL}"
          python3 scripts/smoke_test.py --base-url "${TARGET_URL}"
