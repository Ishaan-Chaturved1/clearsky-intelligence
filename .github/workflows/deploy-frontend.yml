name: Deploy Frontend — Build & S3 / CloudFront

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - development
      api_base_url:
        description: 'Backend API Base URL (leave empty to use existing secret/default)'
        required: false
        default: ''
        type: string

  push:
    branches: [ main ]
    paths:
      - 'frontend/**'

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGION: us-east-1
  TARGET_ENV: ${{ github.event.inputs.target_environment || 'production' }}

jobs:
  build:
    name: Build React/Vite Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run TypeScript Check & Production Build
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || secrets.VITE_API_BASE_URL || secrets.DEPLOYMENT_URL || '' }}
        run: |
          echo "Building frontend with VITE_API_BASE_URL: ${VITE_API_BASE_URL:-[relative /api]}"
          npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist/
          retention-days: 7

  deploy-s3:
    name: Deploy to S3 Static Hosting
    runs-on: ubuntu-latest
    needs: [build]
    environment: production
    permissions:
      contents: read

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: Verify AWS Identity & Account ID
        env:
          EXPECTED_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          CALLER_ACCOUNT=$(aws sts get-caller-identity --query "Account" --output text)
          echo "Authenticated to AWS Account: ${CALLER_ACCOUNT}"
          if [ -n "$EXPECTED_ACCOUNT_ID" ] && [ "$CALLER_ACCOUNT" != "$EXPECTED_ACCOUNT_ID" ]; then
            echo "::error::Account mismatch! Current account ${CALLER_ACCOUNT} does not match expected ${EXPECTED_ACCOUNT_ID}."
            exit 1
          fi

      - name: Download Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend-dist/

      - name: Sync Static Assets to Dedicated S3 Bucket
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          CUSTOM_BUCKET: ${{ secrets.S3_FRONTEND_BUCKET }}
        run: |
          BUCKET="${CUSTOM_BUCKET:-clearsky-frontend-${TARGET_ENV}-${ACCOUNT_ID}}"
          echo "Deploying frontend to S3 bucket: ${BUCKET}"

          # Ensure bucket exists and has versioning enabled
          if ! aws s3api head-bucket --bucket "${BUCKET}" 2>/dev/null; then
            echo "Bucket ${BUCKET} not found. Creating..."
            aws s3 mb "s3://${BUCKET}" --region "${REGION}"
            aws s3api put-bucket-versioning --bucket "${BUCKET}" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "${BUCKET}" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3 website "s3://${BUCKET}" --index-document index.html --error-document index.html
          fi

          echo "Syncing hashed static assets with immutable cache header..."
          aws s3 sync frontend-dist/ "s3://${BUCKET}/" \
            --delete \
            --cache-control "max-age=31536000,immutable" \
            --exclude "index.html" \
            --region "${REGION}"

          echo "Uploading index.html with no-cache header for SPA routing..."
          aws s3 cp frontend-dist/index.html "s3://${BUCKET}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html" \
            --region "${REGION}"

          echo "Frontend successfully synced to s3://${BUCKET}/"

      - name: Invalidate CloudFront Cache (if configured)
        env:
          CF_DIST_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        if: ${{ env.CF_DIST_ID != '' }}
        run: |
          echo "Invalidating CloudFront distribution ${CF_DIST_ID}..."
          aws cloudfront create-invalidation \
            --distribution-id "${CF_DIST_ID}" \
            --paths "/*"
          echo "CloudFront invalidation submitted."
